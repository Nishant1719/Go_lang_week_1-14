basePath: /
definitions:
  main.User:
    properties:
      email:
        type: string
      firstname:
        type: string
      lastname:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a simple REST API built with Go and SQLite.
  title: Simple Go SQLite API
  version: "1.0"
paths:
  /users:
    get:
      description: Fetch all users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.User'
            type: array
      summary: Get all users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Add a new user to the database
      parameters:
      - description: User Data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/main.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.User'
      summary: Create a user
      tags:
      - users
swagger: "2.0"
